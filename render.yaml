services:
  - type: web
    name: seatwise-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: "SeatWise <noreply@seatwise.example>"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: seatwise-db
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: seatwise-db
    plan: free
