services:
  - type: web
    name: seatwise-api
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: "SeatWise <noreply@seatwise.example>"
      - key: CORS_ORIGINS
        value: "https://seatwise-web.onrender.com,http://localhost:5173,http://localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: seatwise-db
          property: connectionString
      - key: REDIS_URL
        fromKeyStore:
          name: seatwise-redis
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: PUBLIC_URL
        value: "https://seatwise-api.onrender.com"

  - type: web
    name: seatwise-web
    env: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://seatwise-api.onrender.com"
      - key: VITE_SHOW_DEMO
        value: "true"

databases:
  - name: seatwise-db
    databaseName: seatwise
    user: seatwise
    plan: starter

keyStores:
  - name: seatwise-redis
    plan: free
