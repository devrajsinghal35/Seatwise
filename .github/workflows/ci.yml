name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'chore/**'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  server-tests:
    name: Server Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: seatwise_test
          POSTGRES_USER: seatwise
          POSTGRES_PASSWORD: seatwise_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server test suite
        working-directory: server
        env:
          DATABASE_URL: postgres://seatwise:seatwise_password@localhost:5432/seatwise_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-ci-secret-with-minimum-thirty-two-chars
          NODE_ENV: test
        run: npm test

  web-check:
    name: Web Quality & Tests (Typecheck, Build, ESLint, Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Typecheck and build bundle
        working-directory: web
        run: npm run build

      - name: Run Vitest unit & a11y tests
        working-directory: web
        run: npm test

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build server Docker image
        run: docker build -t seatwise-server:ci ./server

      - name: Build web Docker image
        run: docker build -t seatwise-web:ci ./web
